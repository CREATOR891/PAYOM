name: Build PAYOM Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name payom --org com.sharipov --no-pub .
          fi

      - name: Install dependencies
        run: flutter pub get

      # Analyze the app source only. The generated template test may target
      # a different Flutter template and is not part of the starter app yet.
      - name: Analyze app source
        run: flutter analyze lib --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAYOM-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
